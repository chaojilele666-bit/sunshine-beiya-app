<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>北京阳光北亚家政后台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="loginView" class="login-view">
      <div class="login-card">
        <div class="login-brand">北京阳光北亚家政</div>
        <h1>后台登录</h1>
        <p>运营端和管理端账号登录后台管理。</p>
        <form id="loginForm" class="login-form">
          <div class="field">
            <label>账号或手机号</label>
            <input name="identifier" autocomplete="username" required />
          </div>
          <div class="field">
            <label>密码</label>
            <input name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit">登录</button>
        </form>
        <div id="loginTip" class="login-tip"></div>
      </div>
    </section>

    <button id="mobileNavToggle" class="mobile-nav-toggle app-shell" type="button" aria-label="打开功能导航">☰</button>

    <aside class="sidebar app-shell" id="sidebar">
      <div class="sidebar-brand">
        <strong>阳光北亚家政后台</strong>
        <span>账号管理与数据运营平台</span>
      </div>
      <nav class="tabs" aria-label="后台功能导航">
        <button class="tab active" data-route="home">首页</button>
        <button class="tab" data-route="dashboard" data-resource="dashboard">每日数据</button>
        <button class="tab" data-route="demands" data-resource="demands">客户需求</button>
        <button class="tab" data-route="demands-list" data-resource="demands">客户管理</button>
        <button class="tab" data-route="ayis" data-resource="ayis">阿姨管理</button>
        <button class="tab" data-route="demands-interviews" data-resource="appointments">面试安排</button>
        <button class="tab" data-route="appointments" data-resource="appointments">预约记录</button>
        <button class="tab" data-route="todos" data-resource="todos">跟进待办</button>
        <button class="tab" data-route="stores" data-resource="stores">门店信息</button>
        <button class="tab" data-route="accounts" data-resource="accounts">账号与权限</button>
        <button class="tab" data-route="company-services" data-resource="serviceModules">公司服务配置</button>
        <button class="tab" data-route="exports" data-resource="exportInfo">导出信息</button>
        <button class="tab" data-route="audit-logs" data-resource="auditLogs">审计日志</button>
        <button class="tab" data-route="applications" data-resource="applications">接单申请</button>
        <button class="tab" data-route="orders" data-resource="orders">订单跟进</button>
        <button class="tab" data-route="dispatches" data-resource="orderDispatches">人工派单</button>
      </nav>
      <div class="sidebar-footer">
        <button id="sidebarProfileBtn" class="sidebar-profile" type="button">
          <span>个人信息</span>
          <small>账号信息与安全管理</small>
        </button>
        <button id="sidebarLogoutBtn" class="sidebar-logout" type="button">退出登录</button>
      </div>
    </aside>

    <header class="topbar app-shell">
      <div class="topbar-title">
        <h1 id="topPageTitle">首页</h1>
        <p id="topBreadcrumb">首页 / 首页经营数据</p>
      </div>
      <div class="topbar-actions">
        <button id="refreshBtn" class="icon-button" type="button" title="刷新数据">↻</button>
        <button id="notificationBtn" class="notification-button" type="button" title="通知">
          <span>通知</span>
          <strong id="notificationCount">0</strong>
        </button>
        <div id="currentOrg" class="current-org">待完善归属</div>
        <div class="account-menu">
          <button id="accountMenuBtn" class="account-trigger" type="button" aria-expanded="false">
            <span class="avatar" aria-hidden="true">人</span>
            <span id="currentUser" class="current-user"></span>
            <span class="account-arrow" aria-hidden="true">⌄</span>
          </button>
          <div id="accountDropdown" class="account-dropdown" hidden>
            <button type="button" data-shell-action="profile">个人信息</button>
            <button type="button" data-shell-action="password">修改密码</button>
            <button type="button" data-shell-action="logout">退出登录</button>
          </div>
        </div>
      </div>
      <button id="logoutBtn" class="secondary top-logout">退出</button>
      <a class="api-link" href="/api/miniprogram" target="_blank">小程序接口预览</a>
    </header>

    <main class="layout app-shell">

      <section class="panel">
        <div class="panel-head">
          <button id="backHomeBtn" class="secondary back-home" type="button">返回后台首页</button>
          <div>
            <h2 id="sectionTitle">后台功能首页</h2>
            <p id="sectionDesc">选择一个功能模块进入独立页面视图。</p>
          </div>
          <button id="addBtn">新增</button>
        </div>

        <div id="list" class="list"></div>
      </section>

      <aside class="editor">
        <h2 id="formTitle">新增/编辑</h2>
        <form id="form"></form>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <div id="drawerOverlay" class="drawer-overlay app-shell" hidden></div>
    <aside id="profileDrawer" class="profile-drawer app-shell" aria-label="个人信息抽屉" hidden>
      <div class="drawer-head">
        <div>
          <h2>个人信息</h2>
          <p>账号信息与安全管理</p>
        </div>
        <button id="profileDrawerClose" class="secondary" type="button">关闭</button>
      </div>
      <div id="profileDrawerBody" class="drawer-body"></div>
    </aside>

    <script src="./app.js"></script>
  </body>
</html>
