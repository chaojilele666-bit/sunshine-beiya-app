<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>北京阳光北亚家政后台</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <section id="loginView" class="login-view">
      <div class="login-card">
        <div class="login-brand">北京阳光北亚家政</div>
        <h1>后台登录</h1>
        <p>运营端和管理端账号登录后台管理。</p>
        <form id="loginForm" class="login-form">
          <div class="field">
            <label>账号或手机号</label>
            <input name="identifier" autocomplete="username" required />
          </div>
          <div class="field">
            <label>密码</label>
            <input name="password" type="password" autocomplete="current-password" required />
          </div>
          <button type="submit">登录</button>
        </form>
        <div id="loginTip" class="login-tip"></div>
      </div>
    </section>

    <header class="topbar app-shell">
      <div>
        <h1>北京阳光北亚家政后台</h1>
        <p>一期覆盖小程序完整流程：客户需求、预约、阿姨资料、接单、订单、门店和首页展示。</p>
      </div>
      <div id="currentUser" class="current-user"></div>
      <button id="refreshBtn">刷新数据</button>
      <button id="logoutBtn" class="secondary top-logout">退出</button>
      <a class="api-link" href="/api/miniprogram" target="_blank">小程序接口预览</a>
    </header>

    <main class="layout app-shell">
      <nav class="tabs">
        <button class="tab active" data-route="home">后台首页</button>
        <button class="tab" data-route="dashboard" data-resource="dashboard">经营看板</button>
        <button class="tab" data-route="accounts" data-resource="accounts">账号权限</button>
        <button class="tab" data-route="audit-logs" data-resource="auditLogs">&#25805;&#20316;&#35760;&#24405;</button>
        <button class="tab" data-route="todos" data-resource="todos">今日待办</button>
        <button class="tab" data-route="ayis" data-resource="ayis">阿姨管理</button>
        <button class="tab" data-route="demands" data-resource="demands">客户需求</button>
        <button class="tab" data-route="exports" data-resource="exportInfo">导出信息</button>
        <button class="tab" data-route="applications" data-resource="applications">接单申请</button>
        <button class="tab" data-route="orders" data-resource="orders">订单跟进</button>
        <button class="tab" data-route="dispatches" data-resource="orderDispatches">人工派单</button>
        <button class="tab" data-route="stores" data-resource="stores">门店信息</button>
        <button class="tab" data-route="company-services" data-resource="serviceModules">公司服务</button>
      </nav>

      <section class="panel">
        <div class="panel-head">
          <button id="backHomeBtn" class="secondary back-home" type="button">返回后台首页</button>
          <div>
            <h2 id="sectionTitle">后台功能首页</h2>
            <p id="sectionDesc">选择一个功能模块进入独立页面视图。</p>
          </div>
          <button id="addBtn">新增</button>
        </div>

        <div id="list" class="list"></div>
      </section>

      <aside class="editor">
        <h2 id="formTitle">新增/编辑</h2>
        <form id="form"></form>
      </aside>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
